<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Encore Show 5 Node</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0e14;
      --card: #151a24;
      --accent: #4f9cf9;
      --alert: #ef4444;
      --text: #f3f4f6;
      --muted: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: grid;
      grid-template-rows: 1fr auto;
      padding: 18px 22px;
    }
    .main-grid {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 18px;
      height: 100%;
    }
    .card {
      background: var(--card);
      border: 1px solid #242c3d;
      border-radius: 18px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .clock {
      font-size: 4.4rem;
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
    }
    .date {
      color: var(--muted);
      font-size: 1.15rem;
      margin-top: 8px;
    }
    .badge-row {
      display: flex;
      gap: 10px;
      align-items: center;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
    }
    .dot.online { background: #22c55e; }
    .ai-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      margin-bottom: 10px;
    }
    .ai-reply {
      font-size: 1.25rem;
      line-height: 1.45;
      color: var(--text);
      overflow-y: auto;
    }
    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    button {
      background: #222b3c;
      color: var(--text);
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button.primary { background: var(--accent); color: #06101f; border-color: var(--accent); font-weight: 600; }
    #camera-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      display: none;
      flex-direction: column;
      z-index: 50;
    }
    #camera-overlay.active { display: flex; }
    .overlay-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 2px solid var(--alert);
    }
    .overlay-frame {
      flex: 1;
      width: 100%;
      border: 0;
      background: #000;
    }
  </style>
</head>
<body>
  <div class="main-grid">
    <section class="card">
      <div>
        <div class="clock" id="clock">--:--</div>
        <div class="date" id="date">Loading...</div>
      </div>
      <div class="badge-row">
        <span class="dot" id="conn-dot"></span>
        <span id="conn-label">Connecting to Encore Brain...</span>
      </div>
    </section>

    <section class="card">
      <div>
        <div class="ai-title">Surface Pro 3 AI Agent</div>
        <div class="ai-reply" id="ai-reply">Mesh idle. Press Wake AI or tap a camera feed.</div>
      </div>
      <div class="btn-row">
        <button class="primary" id="wake-btn">Wake AI</button>
        <button id="cam-btn">Front Door Cam</button>
      </div>
    </section>
  </div>

  <div id="camera-overlay">
    <div class="overlay-bar">
      <strong id="cam-title">Camera Alert</strong>
      <button id="close-cam">Dismiss</button>
    </div>
    <iframe class="overlay-frame" id="cam-frame" allow="autoplay; fullscreen"></iframe>
  </div>

  <script src="/ui/app.js"></script>
</body>
</html>
