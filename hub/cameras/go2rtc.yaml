# go2rtc configuration for Surface Pro 3 (Intel QuickSync VA-API)
# Bridges RTSP cameras into Apple HomeKit (replacing heavy Homebridge) and WebRTC for Echo Show 5 pop-ups.

api:
  listen: ":1984"

rtsp:
  listen: ":8554"

webrtc:
  listen: ":8555"

ffmpeg:
  bin: ffmpeg
  # Use Surface Pro 3 Intel QuickSync (VA-API) whenever transcoding is required
  h264/vaapi: "-hwaccel vaapi -hwaccel_device /dev/dri/renderD128 -hwaccel_output_format vaapi -i {input} -c:v h264_vaapi -bf 0"

streams:
  front_door:
    - rtsp://user:pass@192.168.1.90:554/h264Preview_01_sub
    - ffmpeg:front_door#audio=opus
  driveway:
    - rtsp://user:pass@192.168.1.91:554/h264Preview_01_sub
    - ffmpeg:driveway#audio=opus

# Native HomeKit Camera Bridge — pair directly in the Apple Home app using the PIN below
homekit:
  front_door:
    pin: "194-20-845"
    name: "Front Door"
  driveway:
    pin: "194-20-846"
    name: "Driveway"
